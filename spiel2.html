<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F-15C BLUE CAMO - V3 Ultra Détaillé</title>
<style>
  body{margin:0;background:#030b16;color:white;font-family:'Segoe UI',Arial;text-align:center;overflow:hidden}
  #hud{display:flex;justify-content:space-around;padding:10px;background:#0a1e35;font-weight:bold;border-bottom:3px solid #1e90ff;font-size:15px}
  canvas{background:linear-gradient(#3a8bde 0%, #87c5f0 35%, #e8d5a3 60%, #d9b382 75%, #b8956a 100%);display:block;margin:0 auto}
  .controls{padding:8px;background:#0a1e35}
  button{padding:10px 16px;margin:4px;font-size:15px;background:#1e90ff;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
  button.red{background:#e62e2e} button.gold{background:#e6a700;color:#000}
</style>
</head>
<body>
<div id="hud">
  <span>✈️ F-15C <span style="color:#6ab6ff">BLUE CAMO</span> 86-015</span>
  <span>🎯 <span id="score">0</span> | 💥 <span id="kills">0</span> | ❤️ <span id="lives">5</span></span>
  <span>🚀 AMRAAM <span id="amraam">20</span> | 💣 MAV <span id="mav">10</span></span>
</div>
<canvas id="game" width="900" height="500"></canvas>
<div class="controls">
  <button onclick="fireAMRAAM()">🚀 AMRAAM [ESPACE]</button>
  <button class="red" onclick="fireMaverick()">💣 MAVERICK [X]</button>
  <button class="gold" onclick="flare()">✨ FLARES [F]</button>
  <button onclick="startGame()">🛫 RESTART</button>
  <p style="font-size:13px;color:#9cc8ff;margin:5px">⬆️⬇️ piloter | Ton F-15 a maintenant les 8 missiles visibles + double dérive + postcombustion animée</p>
</div>

<script>
const c=document.getElementById('game'), ctx=c.getContext('2d');
let plane={x:90,y:220}, missiles=[], enemies=[], groundEnemies=[], explosions=[], enemyBullets=[], flares=[], particles=[];
let score=0,kills=0,lives=5,amraam=20,mav=10,frame=0,playing=false,keys={}, shake=0;

// === DESSIN F-15C AMÉLIORÉ ===
function drawF15(x,y, scale=1){
  ctx.save();
  ctx.translate(x,y); ctx.scale(scale,scale);
  // OMBRE
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(45,38,55,8,0,0,Math.PI*2); ctx.fill();

  // POSTCOMBUSTION ANIMÉE - 2 flammes
  let flameLen = 25 + Math.random()*18;
  for(let i=0;i<2;i++){
    let fy = 18 + i*10;
    let grad = ctx.createLinearGradient(0,fy, -flameLen-20, fy);
    grad.addColorStop(0,'#fff'); grad.addColorStop(0.2,'#ffcc00'); grad.addColorStop(0.6,'#ff5500'); grad.addColorStop(1,'rgba(255,0,0,0)');
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.moveTo(0,fy); ctx.lineTo(-flameLen-15, fy+3); ctx.lineTo(-flameLen, fy+6); ctx.lineTo(0,fy+7); ctx.fill();
    // Mach diamonds
    ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fillRect(-flameLen*0.4, fy+2, 6,3);
  }

  // TUYÈRES
  ctx.fillStyle='#222'; ctx.fillRect(-2,14,12,12); ctx.fillRect(-2,26,12,12);
  ctx.fillStyle='#555'; ctx.fillRect(0,15,8,10); ctx.fillRect(0,27,8,10);

  // FUSELAGE PRINCIPAL - bleu clair base
  ctx.fillStyle='#7ab6e8';
  ctx.beginPath(); 
  ctx.moveTo(110,22); // nez
  ctx.lineTo(95,14); ctx.lineTo(60,10); ctx.lineTo(30,12); ctx.lineTo(5,16); ctx.lineTo(5,32); ctx.lineTo(30,36); ctx.lineTo(60,38); ctx.lineTo(95,32); ctx.closePath(); ctx.fill();
  // CAMO BLEU FONCÉ - taches splinter
  ctx.fillStyle='#2a5fa0';
  ctx.beginPath(); ctx.moveTo(25,12); ctx.lineTo(45,11); ctx.lineTo(38,20); ctx.lineTo(22,18); ctx.fill();
  ctx.beginPath(); ctx.moveTo(55,11); ctx.lineTo(75,14); ctx.lineTo(68,24); ctx.lineTo(50,22); ctx.fill();
  ctx.beginPath(); ctx.moveTo(15,28); ctx.lineTo(35,26); ctx.lineTo(40,35); ctx.lineTo(20,35); ctx.fill();
  ctx.fillStyle='#4a8bd4'; ctx.beginPath(); ctx.moveTo(70,28); ctx.lineTo(90,26); ctx.lineTo(85,32); ctx.lineTo(65,34); ctx.fill();

  // NEZ GRIS FONCÉ (radome)
  ctx.fillStyle='#4a4f5a'; ctx.beginPath(); ctx.moveTo(110,22); ctx.lineTo(95,14); ctx.lineTo(90,20); ctx.lineTo(90,24); ctx.lineTo(95,32); ctx.closePath(); ctx.fill();
  // COCKPIT
  ctx.fillStyle='#1a2a3a'; ctx.beginPath(); ctx.ellipse(78,17,12,6, -0.1,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#a8d8ff'; ctx.beginPath(); ctx.ellipse(80,15,8,3, -0.1,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillRect(76,14,4,2);

  // AILE PRINCIPALE - vue de côté un peu de dessus
  ctx.fillStyle='#6aa5dd'; ctx.beginPath(); ctx.moveTo(35,20); ctx.lineTo(55,4); ctx.lineTo(65,4); ctx.lineTo(50,24); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#2a5fa0'; ctx.beginPath(); ctx.moveTo(45,12); ctx.lineTo(58,5); ctx.lineTo(62,5); ctx.lineTo(52,15); ctx.fill();
  // AILE ARRIÈRE
  ctx.fillStyle='#5a9bd4'; ctx.beginPath(); ctx.moveTo(10,22); ctx.lineTo(22,10); ctx.lineTo(28,10); ctx.lineTo(18,24); ctx.closePath(); ctx.fill();

  // DOUBLE DÉRIVE - signature F-15
  ctx.fillStyle='#7ab6e8'; ctx.beginPath(); ctx.moveTo(8,14); ctx.lineTo(4,-6); ctx.lineTo(12,-6); ctx.lineTo(16,12); ctx.fill();
  ctx.fillStyle='#2a5fa0'; ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(4,-6); ctx.lineTo(12,-6); ctx.lineTo(10,0); ctx.fill();
  ctx.fillStyle='#ffcc00'; ctx.fillRect(4,-6,8,2); // bande jaune
  ctx.fillStyle='#000'; ctx.font='bold 7px Arial'; ctx.fillText('FF',6,-1);
  ctx.fillStyle='#7ab6e8'; ctx.beginPath(); ctx.moveTo(20,15); ctx.lineTo(16,-4); ctx.lineTo(24,-4); ctx.lineTo(28,13); ctx.fill();
  ctx.fillStyle='#2a5fa0'; ctx.beginPath(); ctx.moveTo(18,2); ctx.lineTo(16,-4); ctx.lineTo(24,-4); ctx.lineTo(22,2); ctx.fill();
  ctx.fillStyle='#000'; ctx.font='bold 6px Arial'; ctx.fillText('86-015',15,8);

  // INSIGNE USAF
  ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(58,24,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1e3a5a'; ctx.beginPath(); ctx.arc(58,24,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='white'; ctx.font='bold 6px Arial'; ctx.fillText('★',55.5,26.5);

  // MISSILES VISIBLES SOUS L'AILE - 4 AMRAAM blanc + 4 MAVERICK vert
  // AMRAAM
  ctx.fillStyle='#e8e8e8'; ctx.fillRect(38,38,22,4); ctx.fillRect(42,42,22,4);
  ctx.fillStyle='#333'; ctx.fillRect(58,38,3,4); ctx.fillRect(62,42,3,4);
  ctx.fillStyle='#ff0000'; ctx.fillRect(38,38,3,4);
  // MAVERICK
  ctx.fillStyle='#4a5a3a'; ctx.fillRect(50,44,24,5); ctx.fillRect(54,49,24,5);
  ctx.fillStyle='#ddd'; ctx.fillRect(50,44,5,5); ctx.fillRect(54,49,5,5);
  // Entrées d'air
  ctx.fillStyle='#111'; ctx.fillRect(52,26,18,7);
  ctx.fillStyle='#333'; ctx.fillRect(52,26,18,2);

  // Détails panel
  ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(30,16); ctx.lineTo(85,18); ctx.stroke();

  ctx.restore();
}

function startGame(){
  score=0;kills=0;lives=5;amraam=20;mav=10;missiles=[];enemies=[];groundEnemies=[];explosions=[];enemyBullets=[];flares=[];plane.y=220;playing=true;updateHUD();loop();
}
function updateHUD(){
  document.getElementById('score').innerText=score;
  document.getElementById('kills').innerText=kills;
  document.getElementById('lives').innerText=lives;
  document.getElementById('amraam').innerText=amraam;
  document.getElementById('mav').innerText=mav;
}
function fireAMRAAM(){
  if(!playing||amraam<=0) return; amraam--;
  missiles.push({x:plane.x+110,y:plane.y+18,type:'amraam',vx:13,vy:0});
  shake=3; updateHUD();
}
function fireMaverick(){
  if(!playing||mav<=0) return; mav--;
  missiles.push({x:plane.x+70,y:plane.y+45,type:'maverick',vx:8,vy:4});
  shake=4; updateHUD();
}
function flare(){
  if(!playing) return;
  for(let i=0;i<10;i++) flares.push({x:plane.x+10,y:plane.y+30,vx:-2+Math.random()*3,vy:1+Math.random()*3,life:50});
}
function explode(x,y,size){
  explosions.push({x,y,size,life:32});
  for(let i=0;i<12;i++) particles.push({x,y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:20});
}
function loop(){
  if(!playing) return;
  frame++;
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); shake*=0.8; if(shake<0.5) shake=0; }
  ctx.clearRect(-10,-10,920,520);

  // FOND DESERT AMÉLIORÉ
  ctx.fillStyle='#d9b382'; ctx.fillRect(0,460,900,40);
  ctx.fillStyle='#b8956a'; ctx.fillRect(0,440,900,20);
  ctx.fillStyle='#2b2b2b'; ctx.fillRect(0,452,900,5);
  ctx.fillStyle='white'; for(let i=0;i<6;i++) ctx.fillRect((i*180+frame*2)%900,465,40,4); // lignes piste
  // montagnes lointaines
  ctx.fillStyle='#9a8a7a'; ctx.beginPath(); ctx.moveTo(0,440); ctx.lineTo(180,290); ctx.lineTo(360,440); ctx.fill();
  ctx.beginPath(); ctx.moveTo(300,440); ctx.lineTo(520,260); ctx.lineTo(740,440); ctx.fill();
  // nuages
  ctx.fillStyle='rgba(255,255,255,0.85)';
  for(let i=0;i<4;i++){ let cx=(i*300 - frame*0.6)%950; if(cx<-50)cx+=950; ctx.beginPath(); ctx.arc(cx,55+i*22,28,0,Math.PI*2); ctx.arc(cx+26,55+i*22,18,0,Math.PI*2); ctx.fill(); }

  // MOUVEMENT
  if(keys['ArrowUp']) plane.y-=6;
  if(keys['ArrowDown']) plane.y+=6;
  plane.y=Math.max(15,Math.min(400,plane.y));

  // DESSIN F-15 AMÉLIORÉ
  drawF15(plane.x, plane.y, 1.1);

  // MISSILES
  missiles.forEach((m,mi)=>{
    m.x+=m.vx; m.y+=m.vy;
    // trainée
    ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fillRect(m.x-10,m.y+2,10,2);
    ctx.fillStyle=m.type==='amraam'?'#ffffff':'#ffd400';
    ctx.fillRect(m.x,m.y,26,6);
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.moveTo(m.x+26,m.y); ctx.lineTo(m.x+32,m.y+3); ctx.lineTo(m.x+26,m.y+6); ctx.fill();
    ctx.fillStyle='#ff3300'; ctx.fillRect(m.x-7,m.y+1,7,4);
    if(m.x>920) missiles.splice(mi,1);
    enemies.forEach((e,ei)=>{
      if(m.x<e.x+e.w && m.x+26>e.x && m.y<e.y+e.h && m.y+6>e.y){ explode(e.x,e.y,35); enemies.splice(ei,1); missiles.splice(mi,1); kills++; score+=250; updateHUD(); }
    });
    groundEnemies.forEach((g,gi)=>{
      if(m.x<g.x+g.w && m.x+26>g.x && m.y<g.y+g.h && m.y+6>g.y){ g.hp--; if(g.hp<=0){ explode(g.x,g.y,45); groundEnemies.splice(gi,1); kills++; score+=350; } else explode(m.x,m.y,18); missiles.splice(mi,1); updateHUD(); }
    });
  });

  // ENNEMIS
  if(frame%85===0) enemies.push({x:900,y:50+Math.random()*250,w:72,h:28,hp:1,vy:(Math.random()-0.5)*2});
  if(frame%125===0) groundEnemies.push({x:900,y:425,w:75,h:32,hp:2});
  if(frame%180===0 && enemies.length>0){ let e=enemies[Math.floor(Math.random()*enemies.length)]; enemyBullets.push({x:e.x,y:e.y+13,vx:-7}); }

  enemies.forEach((e,ei)=>{
    e.x-=4.5; e.y+=e.vy;
    // MiG-29 gris rouge
    ctx.fillStyle='#6a6a6a'; ctx.beginPath(); ctx.moveTo(e.x+e.w,e.y+14); ctx.lineTo(e.x+10,e.y); ctx.lineTo(e.x,e.y+14); ctx.lineTo(e.x+10,e.y+28); ctx.fill();
    ctx.fillStyle='#cc2222'; ctx.fillRect(e.x+35,e.y+8,12,10);
    ctx.fillStyle='#ff8800'; ctx.fillRect(e.x-8,e.y+10,8,8);
    if(e.x<-80) enemies.splice(ei,1);
    if(plane.x<e.x+e.w && plane.x+110>e.x && plane.y<e.y+e.h && plane.y+50>e.y){ lives--; explode(e.x,e.y,30); enemies.splice(ei,1); updateHUD(); if(lives<=0){ playing=false; alert('💥 F-15 ABATTU ! Score: '+score+' Kills: '+kills); } }
  });
  groundEnemies.forEach((g,gi)=>{
    g.x-=2.2;
    ctx.fillStyle='#4a4a35'; ctx.fillRect(g.x,g.y,g.w,g.h);
    ctx.fillStyle='#5a5a45'; ctx.fillRect(g.x+12,g.y-10,38,12);
    ctx.fillRect(g.x+45,g.y-7,28,4);
    ctx.fillStyle='#222'; ctx.fillRect(g.x+5,g.y+22,15,8); ctx.fillRect(g.x+50,g.y+22,15,8);
    if(g.x<-80) groundEnemies.splice(gi,1);
  });
  enemyBullets.forEach((b,bi)=>{
    b.x+=b.vx; ctx.fillStyle='#ff2222'; ctx.fillRect(b.x,b.y,12,4); ctx.fillStyle='#ffaa00'; ctx.fillRect(b.x+10,b.y,4,4);
    if(b.x<0) enemyBullets.splice(bi,1);
    if(b.x>plane.x && b.x<plane.x+110 && b.y>plane.y && b.y<plane.y+45){
      if(flares.length>0){ enemyBullets.splice(bi,1); explode(b.x,b.y,20); }
      else { lives--; enemyBullets.splice(bi,1); shake=8; updateHUD(); if(lives<=0){ playing=false; alert('ABATTU! Score: '+score); } }
    }
  });
  flares.forEach((f,fi)=>{ f.x+=f.vx; f.y+=f.vy; f.life--; ctx.fillStyle=`rgba(255,220,80,${f.life/50})`; ctx.beginPath(); ctx.arc(f.x,f.y,5,0,Math.PI*2); ctx.fill(); if(f.life<=0) flares.splice(fi,1); });
  explosions.forEach((ex,ei)=>{ ex.life--; let r=ex.size*(1-ex.life/32+0.4); ctx.fillStyle=`rgba(255,${80+ex.life*4},0,${ex.life/32})`; ctx.beginPath(); ctx.arc(ex.x,ex.y,r,0,Math.PI*2); ctx.fill(); ctx.fillStyle=`rgba(255,255,255,${ex.life/40})`; ctx.beginPath(); ctx.arc(ex.x,ex.y,r*0.5,0,Math.PI*2); ctx.fill(); if(ex.life<=0) explosions.splice(ei,1); });
  particles.forEach((p,pi)=>{ p.x+=p.vx; p.y+=p.vy; p.life--; ctx.fillStyle='#555'; ctx.fillRect(p.x,p.y,3,3); if(p.life<=0) particles.splice(pi,1); });

  if(frame%600===0){ amraam=Math.min(20,amraam+5); mav=Math.min(10,mav+3); updateHUD(); }
  score++; if(frame%10===0) updateHUD();
  ctx.restore();
  requestAnimationFrame(loop);
}
document.addEventListener('keydown',e=>{ keys[e.key]=true; if(e.key===' '){ e.preventDefault(); fireAMRAAM(); } if(e.key==='x'||e.key==='X') fireMaverick(); if(e.key==='f'||e.key==='F') flare(); });
document.addEventListener('keyup',e=>keys[e.key]=false);
c.addEventListener('click',()=>fireAMRAAM());
c.addEventListener('mousemove',e=>{ const r=c.getBoundingClientRect(); plane.y=e.clientY-r.top-20; });
startGame();
</script>
</body>
</html>
