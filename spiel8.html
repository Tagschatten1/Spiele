<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>F-15C BLUE - LOCK AMRAAM 0.3s</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#030b16;color:white;font-family:Arial;overflow:hidden;touch-action:none}
  #hud{display:flex;justify-content:space-between;padding:8px 10px;background:#0a1e35;font-weight:bold;font-size:13px;border-bottom:2px solid #1e90ff}
  #hud b{color:#6ab6ff}
  canvas{width:100vw;height:50vh;display:block;background:linear-gradient(#3a8bde 0%, #87c5f0 35%, #e8d5a3 60%, #d9b382 75%, #b8956a 100%);cursor:crosshair}
  #mobileControls{height:50vh;background:#0a1e35;display:flex;padding:8px;gap:8px}
  #joyZone{flex:1.1;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(255,255,255,0.06);border-radius:16px;border:1px solid #1e3a5a}
  #joyBase{width:120px;height:120px;border-radius:50%;background:rgba(30,144,255,0.2);border:2px solid #1e90ff;position:relative}
  #joyStick{width:55px;height:55px;border-radius:50%;background:#1e90ff;border:3px solid white;position:absolute;left:32px;top:32px}
  #joyLabel{position:absolute;bottom:8px;font-size:10px;color:#9cc8ff;font-weight:bold}
  #btnZone{flex:1.4;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px;flex:1}
  .btn{flex:1;border:none;border-radius:14px;font-size:15px;font-weight:900;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,0.4)}
  .btn:active{transform:translateY(4px);box-shadow:none}
  .btn small{font-size:10px;font-weight:400}
  .btn-amraam{background:#e62e2e} .btn-amraam.locked{background:#00ff66;color:#000;box-shadow:0 0 20px #00ff66} .btn-amraam.locking{background:#ff8800}
  .btn-mav{background:#e6a700;color:#000} .btn-mav.locked{background:#00ff66;box-shadow:0 0 20px #00ff66} .btn-mav.locking{background:#ff8800}
  .btn-flare{background:#00aa55} .btn-pause{background:#7a2bff} .btn-sound{background:#333;border:2px solid #1e90ff;font-size:13px}
  #scorePop{position:absolute;top:65px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:900;color:yellow;text-shadow:2px 2px 0 #000;pointer-events:none;opacity:0;transition:opacity 0.3s;z-index:10}
  #lockHUD{position:absolute;top:58px;right:10px;background:rgba(0,0,0,0.7);padding:6px 10px;border-radius:8px;font-size:13px;font-weight:bold;border:1px solid #333;z-index:10}
  #pauseOverlay{position:absolute;top:0;left:0;width:100vw;height:50vh;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20}
  #pcHelp{text-align:center;font-size:11px;color:#9cc8ff;padding:4px;background:#0a1e35}
  kbd{background:#1e3a5a;padding:2px 6px;border-radius:4px;border:1px solid #1e90ff}
</style>
</head>
<body>
<div id="hud"><span>✈️ <b>86-015 BLUE</b></span><span>🎯 <span id="score">0</span> 💥 <span id="kills">0</span></span><span>❤️ <span id="lives">5</span> 🚀 <span id="amraam">20</span> 💣 <span id="mav">10</span></span></div>
<div id="scorePop">+250</div>
<div id="lockHUD">🔓 NO LOCK</div>
<div style="position:relative">
  <canvas id="game" width="900" height="500"></canvas>
  <div id="pauseOverlay"><h1 style="font-size:40px;margin:0;color:#1e90ff">⏸️ PAUSE</h1><button onclick="togglePause()" style="padding:12px 24px;font-size:18px;background:#1e90ff;color:white;border:none;border-radius:10px;cursor:pointer;font-weight:bold">▶️ REPRENDRE</button></div>
</div>
<div id="pcHelp">🎯 <b>LOCK :</b> AMRAAM <span style="color:#00ff66">0.3s</span> | MAVERICK 0.5s &nbsp; <kbd>⬆️</kbd><kbd>⬇️</kbd> piloter &nbsp; 🖱️ viser &nbsp; <kbd>ESPACE</kbd> AMRAAM &nbsp; <kbd>X</kbd> MAV &nbsp; <kbd>P</kbd> PAUSE</div>

<div id="mobileControls">
  <div id="joyZone"><div id="joyBase"><div id="joyStick"></div></div><div id="joyLabel">🕹️ JOYSTICK / SOURIS</div></div>
  <div id="btnZone">
    <div class="row">
      <button class="btn btn-amraam" id="btnAmraam">🚀<span>AMRAAM 0.3s</span><small id="subAmraam">NO LOCK</small></button>
      <button class="btn btn-mav" id="btnMav">💣<span>MAV 0.5s</span><small id="subMav">NO LOCK</small></button>
    </div>
    <div class="row">
      <button class="btn btn-flare" id="btnFlare">✨<span>FLARES</span><small>F</small></button>
      <button class="btn btn-pause" id="btnPause">⏸️<span>PAUSE</span><small>P</small></button>
    </div>
    <div class="row" style="flex:0.6">
      <button class="btn btn-sound" id="btnSound" style="flex:1">🔊 SON: ON</button>
      <button class="btn btn-sound" onclick="startGame()" style="flex:1;background:#1e90ff">🛫 RESTART</button>
    </div>
  </div>
</div>

<script>
const c=document.getElementById('game'), ctx=c.getContext('2d');
let plane={x:90,y:220,targetY:220}, missiles=[], enemies=[], groundEnemies=[], explosions=[], enemyBullets=[], flares=[];
let score=0,kills=0,lives=5,amraam=20,mav=10,frame=0,playing=false, paused=false, joyY=0, shake=0, soundOn=true, keys={}, mouseActive=false, crossX=450, crossY=250;
let lockAir=null, lockGround=null, lockTimeAir=0, lockTimeGround=0;
// === TEMPS DE LOCK MODIFIÉS ===
let LOCK_TIME_AIR=18; // 0.3s à 60fps -> AMRAAM RAPIDE
let LOCK_TIME_GROUND=30; // 0.5s -> MAVERICK

let audioCtx=null, engineOsc=null, engineGain=null;
function initAudio(){
  if(audioCtx) return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  let bufferSize=2*audioCtx.sampleRate, buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate), data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=Math.random()*2-1;
  let noise=audioCtx.createBufferSource(); noise.buffer=buffer; noise.loop=true;
  let filter=audioCtx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=400;
  engineGain=audioCtx.createGain(); engineGain.gain.value=0.06;
  noise.connect(filter); filter.connect(engineGain); engineGain.connect(audioCtx.destination); noise.start();
  engineOsc=audioCtx.createOscillator(); engineOsc.type='sawtooth'; engineOsc.frequency.value=55;
  let g2=audioCtx.createGain(); g2.gain.value=0.03; engineOsc.connect(g2); g2.connect(audioCtx.destination); engineOsc.start();
}
function beep(freq,dur=0.08,vol=0.15){
  if(!soundOn||!audioCtx) return;
  let o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='square'; o.frequency.value=freq; g.gain.value=vol; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur);
}
function playMissile(){ if(!soundOn||!audioCtx) return; let o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(800,audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(150,audioCtx.currentTime+0.4); g.gain.setValueAtTime(0.25,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.4); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.4); }
function playExplosion(){ if(!soundOn||!audioCtx) return; let bufferSize=audioCtx.sampleRate*0.5, buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate), data=buffer.getChannelData(0); for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/bufferSize,2); let src=audioCtx.createBufferSource(); src.buffer=buffer; let f=audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500; let g=audioCtx.createGain(); g.gain.value=0.6; src.connect(f); f.connect(g); g.connect(audioCtx.destination); src.start(); if(navigator.vibrate) navigator.vibrate([80,30,80]); }

function togglePause(){
  if(!playing) return; paused=!paused;
  document.getElementById('pauseOverlay').style.display=paused?'flex':'none';
  if(!paused){ requestAnimationFrame(loop); if(engineGain) engineGain.gain.value=0.06; } else if(engineGain) engineGain.gain.value=0;
  document.getElementById('btnPause').innerHTML=paused?'▶️<span>REPRISE</span><small>P</small>':'⏸️<span>PAUSE</span><small>P</small>';
}
function drawF15(x,y){
  ctx.save(); ctx.translate(x,y); ctx.scale(1.1,1.1);
  let flameLen=25+Math.random()*18;
  for(let i=0;i<2;i++){ let fy=18+i*10; let grad=ctx.createLinearGradient(0,fy,-flameLen-20,fy); grad.addColorStop(0,'#fff'); grad.addColorStop(0.2,'#ffcc00'); grad.addColorStop(0.6,'#ff5500'); grad.addColorStop(1,'rgba(255,0,0,0)'); ctx.fillStyle=grad; ctx.beginPath(); ctx.moveTo(0,fy); ctx.lineTo(-flameLen-15,fy+3); ctx.lineTo(-flameLen,fy+6); ctx.lineTo(0,fy+7); ctx.fill(); }
  ctx.fillStyle='#222'; ctx.fillRect(-2,14,12,12); ctx.fillRect(-2,26,12,12);
  ctx.fillStyle='#7ab6e8'; ctx.beginPath(); ctx.moveTo(110,22); ctx.lineTo(95,14); ctx.lineTo(60,10); ctx.lineTo(30,12); ctx.lineTo(5,16); ctx.lineTo(5,32); ctx.lineTo(30,36); ctx.lineTo(60,38); ctx.lineTo(95,32); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#2a5fa0'; ctx.beginPath(); ctx.moveTo(25,12); ctx.lineTo(45,11); ctx.lineTo(38,20); ctx.lineTo(22,18); ctx.fill(); ctx.beginPath(); ctx.moveTo(55,11); ctx.lineTo(75,14); ctx.lineTo(68,24); ctx.lineTo(50,22); ctx.fill(); ctx.beginPath(); ctx.moveTo(15,28); ctx.lineTo(35,26); ctx.lineTo(40,35); ctx.lineTo(20,35); ctx.fill();
  ctx.fillStyle='#4a4f5a'; ctx.beginPath(); ctx.moveTo(110,22); ctx.lineTo(95,14); ctx.lineTo(90,20); ctx.lineTo(90,24); ctx.lineTo(95,32); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#1a2a3a'; ctx.beginPath(); ctx.ellipse(78,17,12,6,-0.1,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#a8d8ff'; ctx.beginPath(); ctx.ellipse(80,15,8,3,-0.1,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#6aa5dd'; ctx.beginPath(); ctx.moveTo(35,20); ctx.lineTo(55,4); ctx.lineTo(65,4); ctx.lineTo(50,24); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#7ab6e8'; ctx.beginPath(); ctx.moveTo(8,14); ctx.lineTo(4,-6); ctx.lineTo(12,-6); ctx.lineTo(16,12); ctx.fill(); ctx.fillStyle='#ffcc00'; ctx.fillRect(4,-6,8,2);
  ctx.fillStyle='#7ab6e8'; ctx.beginPath(); ctx.moveTo(20,15); ctx.lineTo(16,-4); ctx.lineTo(24,-4); ctx.lineTo(28,13); ctx.fill();
  ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(58,24,5,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#1e3a5a'; ctx.beginPath(); ctx.arc(58,24,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#e8e8e8'; ctx.fillRect(38,38,22,4); ctx.fillRect(42,42,22,4);
  ctx.fillStyle='#4a5a3a'; ctx.fillRect(50,44,24,5); ctx.fillRect(54,49,24,5); ctx.fillStyle='#ddd'; ctx.fillRect(50,44,5,5); ctx.fillRect(54,49,5,5);
  ctx.fillStyle='#111'; ctx.fillRect(52,26,18,7);
  ctx.restore();
}
function startGame(){ initAudio(); if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); score=0;kills=0;lives=5;amraam=20;mav=10;missiles=[];enemies=[];groundEnemies=[];explosions=[];enemyBullets=[];flares=[];plane.y=220;plane.targetY=220;lockAir=null;lockGround=null;lockTimeAir=0;lockTimeGround=0;playing=true;paused=false;document.getElementById('pauseOverlay').style.display='none';updateHUD();loop(); }
function updateHUD(){ document.getElementById('score').innerText=score; document.getElementById('kills').innerText=kills; document.getElementById('lives').innerText=lives; document.getElementById('amraam').innerText=amraam; document.getElementById('mav').innerText=mav; }
function showPop(t){ let p=document.getElementById('scorePop'); p.innerText=t; p.style.opacity=1; setTimeout(()=>p.style.opacity=0,600); }

function fireAMRAAM(){
  if(!playing||paused) return;
  if(!lockAir || lockTimeAir<LOCK_TIME_AIR){ showPop('🔓 NO LOCK - Vise 0.3s !'); beep(200,0.15,0.2); return; }
  if(amraam<=0) return;
  amraam--;
  let target=lockAir;
  missiles.push({x:plane.x+110,y:plane.y+18,type:'amraam',vx:13,vy:0,target:target,homing:true});
  shake=3; playMissile(); lockAir=null; lockTimeAir=0; updateHUD();
}
function fireMaverick(){
  if(!playing||paused) return;
  if(!lockGround || lockTimeGround<LOCK_TIME_GROUND){ showPop('🔓 NO LOCK SOL - Vise T-72 0.5s !'); beep(200,0.15,0.2); return; }
  if(mav<=0) return;
  mav--;
  let target=lockGround;
  missiles.push({x:plane.x+70,y:plane.y+45,type:'maverick',vx:8,vy:3,target:target,homing:true});
  shake=4; playMissile(); lockGround=null; lockTimeGround=0; updateHUD();
}
function flare(){ if(!playing||paused) return; for(let i=0;i<10;i++) flares.push({x:plane.x+10,y:plane.y+30,vx:-2+Math.random()*3,vy:1+Math.random()*3,life:50}); }
function explode(x,y,size){ explosions.push({x,y,size,life:32}); playExplosion(); }

function updateLock(){
  let bestAir=null, bestDistAir=90, bestGround=null, bestDistGround=90;
  enemies.forEach(e=>{ let cx=e.x+e.w/2, cy=e.y+e.h/2, d=Math.hypot(crossX-cx, crossY-cy); if(d<bestDistAir){ bestDistAir=d; bestAir=e; } });
  groundEnemies.forEach(g=>{ let cx=g.x+g.w/2, cy=g.y+g.h/2, d=Math.hypot(crossX-cx, crossY-cy); if(d<bestDistGround){ bestDistGround=d; bestGround=g; } });

  if(bestAir){
    if(lockAir===bestAir){ lockTimeAir++; if(lockTimeAir%6===0) beep(900,0.04,0.08); }
    else { lockAir=bestAir; lockTimeAir=0; }
    if(lockTimeAir>=LOCK_TIME_AIR && lockTimeAir===LOCK_TIME_AIR){ beep(1200,0.15,0.25); beep(1500,0.25,0.25); showPop('🔒 LOCK AMRAAM 0.3s !'); if(navigator.vibrate) navigator.vibrate(60); }
  } else { lockAir=null; lockTimeAir=0; }

  if(bestGround){
    if(lockGround===bestGround){ lockTimeGround++; if(lockTimeGround%10===0) beep(600,0.05,0.08); }
    else { lockGround=bestGround; lockTimeGround=0; }
    if(lockTimeGround>=LOCK_TIME_GROUND && lockTimeGround===LOCK_TIME_GROUND){ beep(1000,0.2,0.25); showPop('🔒 LOCK MAVERICK !'); if(navigator.vibrate) navigator.vibrate(60); }
  } else { lockGround=null; lockTimeGround=0; }

  let hud=document.getElementById('lockHUD');
  let btnA=document.getElementById('btnAmraam'), btnM=document.getElementById('btnMav');
  let subA=document.getElementById('subAmraam'), subM=document.getElementById('subMav');
  btnA.classList.remove('locked','locking'); btnM.classList.remove('locked','locking');
  if(lockAir && lockTimeAir>=LOCK_TIME_AIR){ hud.innerHTML='🔒 <span style="color:#00ff66">LOCK AMRAAM 0.3s</span> - FEU !'; hud.style.borderColor='#00ff66'; btnA.classList.add('locked'); subA.innerText='🔒 LOCK 0.3s - FEU !'; }
  else if(lockAir){ let p=Math.round(lockTimeAir/LOCK_TIME_AIR*100); hud.innerHTML=`🎯 LOCKING AIR ${p}% (0.3s)`; hud.style.borderColor='#ff8800'; btnA.classList.add('locking'); subA.innerText=`LOCKING ${p}%`; }
  else if(lockGround && lockTimeGround>=LOCK_TIME_GROUND){ hud.innerHTML='🔒 <span style="color:#00ff66">LOCK MAVERICK 0.5s</span> - FEU !'; hud.style.borderColor='#00ff66'; btnM.classList.add('locked'); subM.innerText='🔒 LOCK - FEU !'; }
  else if(lockGround){ let p=Math.round(lockTimeGround/LOCK_TIME_GROUND*100); hud.innerHTML=`🎯 LOCKING SOL ${p}% (0.5s)`; hud.style.borderColor='#ff8800'; btnM.classList.add('locking'); subM.innerText=`LOCKING ${p}%`; }
  else { hud.innerHTML='🔓 NO LOCK - Vise un ennemi'; hud.style.borderColor='#333'; subA.innerText='NO LOCK'; subM.innerText='NO LOCK'; }
}

function drawLockBox(target, progress, maxTime, locked, color){
  if(!target) return;
  let x=target.x-5, y=target.y-5, w=target.w+10, h=target.h+10;
  ctx.strokeStyle=locked?'#00ff66':color; ctx.lineWidth=locked?3:2; ctx.strokeRect(x,y,w,h);
  ctx.fillStyle=locked?'#00ff66':color;
  ctx.fillRect(x-3,y-3,10,3); ctx.fillRect(x-3,y-3,3,10);
  ctx.fillRect(x+w-7,y-3,10,3); ctx.fillRect(x+w,y-3,3,10);
  ctx.fillRect(x-3,y+h,10,3); ctx.fillRect(x-3,y+h-7,3,10);
  ctx.fillRect(x+w-7,y+h,10,3); ctx.fillRect(x+w,y+h-7,3,10);
  if(!locked){
    ctx.strokeStyle='#ffcc00'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(target.x+target.w/2, target.y+target.h/2, 32, -Math.PI/2, -Math.PI/2 + (progress/maxTime)*Math.PI*2); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 11px Arial'; ctx.fillText(Math.round(progress/maxTime*100)+'%', target.x+target.w/2-14, target.y-8);
  } else {
    ctx.fillStyle='#00ff66'; ctx.font='bold 12px Arial'; ctx.fillText('🔒 LOCK', target.x, target.y-8);
  }
}

function loop(){
  if(!playing||paused) return; frame++;
  if(engineGain && soundOn){ engineGain.gain.value=0.05+Math.abs(joyY)*0.08; if(engineOsc) engineOsc.frequency.value=55+Math.abs(joyY)*30; }
  ctx.save(); if(shake>0){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); shake*=0.8; if(shake<0.5) shake=0; }
  ctx.clearRect(-10,-10,920,520);
  ctx.fillStyle='#d9b382'; ctx.fillRect(0,460,900,40); ctx.fillStyle='#b8956a'; ctx.fillRect(0,440,900,20); ctx.fillStyle='#2b2b2b'; ctx.fillRect(0,452,900,5);
  ctx.fillStyle='white'; for(let i=0;i<6;i++) ctx.fillRect((i*180+frame*2)%900,465,40,4);
  ctx.fillStyle='#9a8a7a'; ctx.beginPath(); ctx.moveTo(0,440); ctx.lineTo(180,290); ctx.lineTo(360,440); ctx.fill(); ctx.beginPath(); ctx.moveTo(300,440); ctx.lineTo(520,260); ctx.lineTo(740,440); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.85)'; for(let i=0;i<4;i++){ let cx=(i*300 - frame*0.6)%950; if(cx<-50)cx+=950; ctx.beginPath(); ctx.arc(cx,55+i*22,28,0,Math.PI*2); ctx.fill(); }

  if(keys['ArrowUp']||keys['w']||keys['W']){ plane.y-=7; mouseActive=false; }
  if(keys['ArrowDown']||keys['s']||keys['S']){ plane.y+=7; mouseActive=false; }
  plane.y += joyY*7;
  if(mouseActive) plane.y += (plane.targetY - plane.y)*0.15;
  plane.y=Math.max(15,Math.min(400,plane.y));
  if(!mouseActive){ crossX=plane.x+300; crossY=plane.y+22; }

  drawF15(plane.x,plane.y);
  updateLock();

  ctx.strokeStyle=lockAir||lockGround?'#00ff66':'#ff3333'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(crossX,crossY,18,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(crossX-25,crossY); ctx.lineTo(crossX-10,crossY); ctx.moveTo(crossX+10,crossY); ctx.lineTo(crossX+25,crossY); ctx.moveTo(crossX,crossY-25); ctx.lineTo(crossX,crossY-10); ctx.moveTo(crossX,crossY+10); ctx.lineTo(crossX,crossY+25); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.setLineDash([5,5]); ctx.beginPath(); ctx.moveTo(plane.x+110,plane.y+22); ctx.lineTo(crossX,crossY); ctx.stroke(); ctx.setLineDash([]);

  missiles.forEach((m,mi)=>{
    if(m.homing && m.target){
      let tx=m.target.x+m.target.w/2, ty=m.target.y+m.target.h/2;
      let dx=tx-m.x, dy=ty-m.y, dist=Math.hypot(dx,dy);
      if(dist>10){ m.vx=10*dx/dist+4; m.vy=10*dy/dist*0.6; }
      if(dist<25){
        if(m.type==='amraam'){ explode(tx,ty,35); enemies.splice(enemies.indexOf(m.target),1); kills++; score+=250; showPop('+250 MiG!'); }
        else { m.target.hp--; if(m.target.hp<=0){ explode(tx,ty,45); groundEnemies.splice(groundEnemies.indexOf(m.target),1); kills++; score+=350; showPop('+350 T-72!'); } else explode(tx,ty,18); }
        missiles.splice(mi,1); updateHUD(); return;
      }
      if((m.type==='amraam' && !enemies.includes(m.target)) || (m.type==='maverick' && !groundEnemies.includes(m.target))){ m.homing=false; }
    }
    m.x+=m.vx; m.y+=m.vy;
    ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fillRect(m.x-10,m.y+2,10,2);
    ctx.fillStyle=m.type==='amraam'?'#fff':'#ffd400'; ctx.fillRect(m.x,m.y,26,6); ctx.fillStyle='#222'; ctx.beginPath(); ctx.moveTo(m.x+26,m.y); ctx.lineTo(m.x+32,m.y+3); ctx.lineTo(m.x+26,m.y+6); ctx.fill(); ctx.fillStyle='#ff3300'; ctx.fillRect(m.x-7,m.y+1,7,4);
    if(m.x>920||m.y>500) missiles.splice(mi,1);
  });

  if(frame%85===0) enemies.push({x:900,y:50+Math.random()*250,w:72,h:28,vy:(Math.random()-0.5)*2});
  if(frame%125===0) groundEnemies.push({x:900,y:425,w:75,h:32,hp:2});
  if(frame%180===0 && enemies.length>0){ let e=enemies[Math.floor(Math.random()*enemies.length)]; enemyBullets.push({x:e.x,y:e.y+13,vx:-7}); }

  enemies.forEach((e,ei)=>{
    e.x-=4.5; e.y+=e.vy; ctx.fillStyle='#6a6a6a'; ctx.beginPath(); ctx.moveTo(e.x+e.w,e.y+14); ctx.lineTo(e.x+10,e.y); ctx.lineTo(e.x,e.y+14); ctx.lineTo(e.x+10,e.y+28); ctx.fill(); ctx.fillStyle='#cc2222'; ctx.fillRect(e.x+35,e.y+8,12,10); ctx.fillStyle='#ff8800'; ctx.fillRect(e.x-8,e.y+10,8,8);
    if(e.x<-80){ enemies.splice(ei,1); if(lockAir===e){ lockAir=null; lockTimeAir=0; } }
    if(plane.x<e.x+e.w && plane.x+110>e.x && plane.y<e.y+e.h && plane.y+50>e.y){ lives--; explode(e.x,e.y,30); enemies.splice(ei,1); updateHUD(); if(lives<=0){ playing=false; alert('💥 ABATTU! Score: '+score); } }
  });
  groundEnemies.forEach((g,gi)=>{ g.x-=2.2; ctx.fillStyle='#4a4a35'; ctx.fillRect(g.x,g.y,g.w,g.h); ctx.fillStyle='#5a5a45'; ctx.fillRect(g.x+12,g.y-10,38,12); ctx.fillRect(g.x+45,g.y-7,28,4); if(g.x<-80){ groundEnemies.splice(gi,1); if(lockGround===g){ lockGround=null; lockTimeGround=0; } } });

  drawLockBox(lockAir, lockTimeAir, LOCK_TIME_AIR, lockAir&&lockTimeAir>=LOCK_TIME_AIR, '#ff8800');
  drawLockBox(lockGround, lockTimeGround, LOCK_TIME_GROUND, lockGround&&lockTimeGround>=LOCK_TIME_GROUND, '#ffcc00');

  enemyBullets.forEach((b,bi)=>{ b.x+=b.vx; ctx.fillStyle='#ff2222'; ctx.fillRect(b.x,b.y,12,4); if(b.x<0) enemyBullets.splice(bi,1); if(b.x>plane.x && b.x<plane.x+110 && b.y>plane.y && b.y<plane.y+45){ if(flares.length>0){ enemyBullets.splice(bi,1); explode(b.x,b.y,20); } else { lives--; enemyBullets.splice(bi,1); shake=8; updateHUD(); if(lives<=0){ playing=false; alert('ABATTU! Score: '+score); } } } });
  flares.forEach((f,fi)=>{ f.x+=f.vx; f.y+=f.vy; f.life--; ctx.fillStyle=`rgba(255,220,80,${f.life/50})`; ctx.beginPath(); ctx.arc(f.x,f.y,5,0,Math.PI*2); ctx.fill(); if(f.life<=0) flares.splice(fi,1); });
  explosions.forEach((ex,ei)=>{ ex.life--; let r=ex.size*(1-ex.life/32+0.4); ctx.fillStyle=`rgba(255,${80+ex.life*4},0,${ex.life/32})`; ctx.beginPath(); ctx.arc(ex.x,ex.y,r,0,Math.PI*2); ctx.fill(); if(ex.life<=0) explosions.splice(ei,1); });

  if(frame%600===0){ amraam=Math.min(20,amraam+5); mav=Math.min(10,mav+3); updateHUD(); }
  score++; if(frame%10===0) updateHUD();
  ctx.restore(); requestAnimationFrame(loop);
}

let joyActive=false, joyId=null;
const joyBase=document.getElementById('joyBase'), joyStick=document.getElementById('joyStick');
function handleJoy(clientX,clientY){ let r=joyBase.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2; let dx=clientX-cx, dy=clientY-cy, max=35; let dist=Math.sqrt(dx*dx+dy*dy); if(dist>max){ dx=dx/dist*max; dy=dy/dist*max; } joyStick.style.left=(32+dx)+'px'; joyStick.style.top=(32+dy)+'px'; joyY=dy/max; crossX=plane.x+300; crossY=plane.y+22+dy*3; mouseActive=false; }
function resetJoy(){ joyStick.style.left='32px'; joyStick.style.top='32px'; joyY=0; }
joyBase.addEventListener('touchstart', e=>{ e.preventDefault(); initAudio(); joyActive=true; joyId=e.touches[0].identifier; handleJoy(e.touches[0].clientX,e.touches[0].clientY); }, {passive:false});
document.addEventListener('touchmove', e=>{ if(!joyActive) return; for(let t of e.touches){ if(t.identifier===joyId){ e.preventDefault(); handleJoy(t.clientX,t.clientY); } } }, {passive:false});
document.addEventListener('touchend', ()=>{ if(joyActive){ joyActive=false; resetJoy(); } });
joyBase.addEventListener('mousedown', e=>{ joyActive=true; handleJoy(e.clientX,e.clientY); });
document.addEventListener('mousemove', e=>{ if(joyActive) handleJoy(e.clientX,e.clientY); });
document.addEventListener('mouseup', ()=>{ if(joyActive){ joyActive=false; resetJoy(); } });

c.addEventListener('mousemove', e=>{ let rect=c.getBoundingClientRect(); crossX=(e.clientX-rect.left)*(900/rect.width); crossY=(e.clientY-rect.top)*(500/rect.height); plane.targetY=crossY-20; mouseActive=true; });
c.addEventListener('click', e=>{ initAudio(); if(paused) return; let rect=c.getBoundingClientRect(); let y=(e.clientY-rect.top)*(500/rect.height); if(y>350) fireMaverick(); else fireAMRAAM(); });
c.addEventListener('contextmenu', e=>{ e.preventDefault(); fireMaverick(); });
c.addEventListener('touchstart', e=>{ let t=e.touches[0], rect=c.getBoundingClientRect(); crossX=(t.clientX-rect.left)*(900/rect.width); crossY=(t.clientY-rect.top)*(500/rect.height); mouseActive=true; }, {passive:true});
c.addEventListener('touchmove', e=>{ let t=e.touches[0], rect=c.getBoundingClientRect(); crossX=(t.clientX-rect.left)*(900/rect.width); crossY=(t.clientY-rect.top)*(500/rect.height); plane.targetY=crossY-20; }, {passive:true});

document.getElementById('btnAmraam').addEventListener('touchstart', e=>{ e.preventDefault(); initAudio(); fireAMRAAM(); }, {passive:false});
document.getElementById('btnMav').addEventListener('touchstart', e=>{ e.preventDefault(); initAudio(); fireMaverick(); }, {passive:false});
document.getElementById('btnFlare').addEventListener('touchstart', e=>{ e.preventDefault(); initAudio(); flare(); }, {passive:false});
document.getElementById('btnAmraam').addEventListener('click', ()=>{ initAudio(); fireAMRAAM(); });
document.getElementById('btnMav').addEventListener('click', ()=>{ initAudio(); fireMaverick(); });
document.getElementById('btnFlare').addEventListener('click', ()=>{ initAudio(); flare(); });
document.getElementById('btnPause').addEventListener('click', togglePause);
document.getElementById('btnSound').addEventListener('click', function(){ initAudio(); soundOn=!soundOn; this.innerHTML=soundOn?'🔊 SON: ON':'🔇 SON: OFF'; if(engineGain) engineGain.gain.value=soundOn?0.06:0; });

document.addEventListener('keydown',e=>{ keys[e.key]=true; initAudio(); if(e.key===' '){ e.preventDefault(); fireAMRAAM(); } if(e.key==='x'||e.key==='X') fireMaverick(); if(e.key==='f'||e.key==='F') flare(); if(e.key==='p'||e.key==='P'||e.key==='Escape') togglePause(); if(e.key==='ArrowUp'||e.key==='ArrowDown') e.preventDefault(); });
document.addEventListener('keyup',e=>{ keys[e.key]=false; });

startGame();
</script>
